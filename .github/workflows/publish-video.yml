name: Publish YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube Video ID (the part after youtu.be/)"
        required: true
      privacy:
        description: "Privacy status after review"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YT_OAUTH_TOKEN: ${{ secrets.YT_OAUTH_TOKEN }}
      VIDEO_ID: ${{ github.event.inputs.video_id }}
      PRIVACY: ${{ github.event.inputs.privacy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restore token.json
        if: env.YT_OAUTH_TOKEN != ''
        run: echo "${YT_OAUTH_TOKEN}" | base64 -d > ./token.json

      - name: Fail if no OAuth token
        if: env.YT_OAUTH_TOKEN == ''
        run: |
          echo "::error::Add the YT_OAUTH_TOKEN secret (base64 of token.json) to enable publishing."
          exit 1

      - name: Set video privacy
        run: python scripts/set_privacy.py --video-id "$VIDEO_ID" --privacy "$PRIVACY"
