name: Publish YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube Video ID (the part after youtu.be/)"
        required: true
      privacy:
        description: "Privacy status after review"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout repo + set up Python
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------
      # 2️⃣ Install only the Google API libraries we need
      # -------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      # -------------------------------------------------
      # 3️⃣ Restore OAuth token from GitHub Secret
      # -------------------------------------------------
      - name: Restore token.json
        if: env.YT_OAUTH_TOKEN != ''
        run: |
          echo "${YT_OAUTH_TOKEN}" | base64 -d > ./token.json
        env:
          YT_OAUTH_TOKEN: ${{ secrets.YT_OAUTH_TOKEN }}

      - name: Warn if no OAuth token
        if: env.YT_OAUTH_TOKEN == ''
        run: |
          echo "⚠️ Add the YT_OAUTH_TOKEN secret (base64 of token.json) to enable publishing."

      # -------------------------------------------------
      # 4️⃣ Change privacy status
      # -------------------------------------------------
      - name: Set video privacy
        if: env.YT_OAUTH_TOKEN != ''
        run: |
          python scripts/set_privacy.py \
            --video-id "${{ github.event.inputs.video_id }}" \
            --privacy "${{ github.event.inputs.privacy }}"
        env:
          YT_OAUTH_TOKEN: ${{ secrets.YT_OAUTH_TOKEN }}