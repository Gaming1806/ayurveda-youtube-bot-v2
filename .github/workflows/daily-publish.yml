name: Ayurvedic Video Bot

on:
  schedule:
    # Runs every day at 09:00 UTC. Change the cron expression if you want a different cadence.
    - cron: '0 9 * * *'
  workflow_dispatch:   # Allows manual trigger from the GitHub UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Job-level env so step-level `if:` conditions can see it
      YT_OAUTH_TOKEN: ${{ secrets.YT_OAUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies (ffmpeg + espeak-ng)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Decode and restore token.json
        if: env.YT_OAUTH_TOKEN != ''
        run: echo "${YT_OAUTH_TOKEN}" | base64 -d > ./token.json

      - name: Warn if no OAuth token
        if: env.YT_OAUTH_TOKEN == ''
        run: echo "::warning::No YT_OAUTH_TOKEN secret found. Upload step will be skipped until you add it."

      - name: Generate content
        run: python scripts/generate_content.py

      - name: Text-to-speech
        run: python scripts/text_to_speech.py --input content/script.txt --output voice.wav

      - name: Fetch footage
        run: python scripts/fetch_footage.py

      - name: Generate thumbnail
        run: python scripts/generate_thumbnail.py --input content/title.txt --output thumbnail.jpg

      - name: Assemble video
        run: python scripts/assemble_video.py --footage footage.mp4 --audio voice.wav --output final_video.mp4

      - name: Upload to YouTube
        if: env.YT_OAUTH_TOKEN != ''
        run: python scripts/upload_to_youtube.py
